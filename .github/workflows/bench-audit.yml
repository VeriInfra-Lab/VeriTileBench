name: Bench audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_audit:
        description: Replay every retained module, including auxiliary theorems
        type: boolean
        default: true
  schedule:
    # 04:00 Asia/Singapore; GitHub cron uses UTC.
    - cron: '0 20 * * *'

permissions:
  contents: read

concurrency:
  group: bench-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Source and audit-tool regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      full_audit: ${{ steps.scope.outputs.full_audit }}
      shard_count: ${{ steps.scope.outputs.shard_count }}
      shards: ${{ steps.scope.outputs.shards }}
      affected_required: ${{ steps.affected.outputs.affected_required }}
      auditor_required: ${{ steps.affected.outputs.auditor_required }}
      affected_shards: ${{ steps.affected.outputs.affected_shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read the audit plan and pinned library source
        id: scope
        env:
          FULL_AUDIT: ${{ inputs.full_audit }}
        run: >-
          python3 scripts/bench/ci.py plan --event "$GITHUB_EVENT_NAME"
          --full-audit "$FULL_AUDIT" --github-output "$GITHUB_OUTPUT"
      - name: Fetch the exact library source for Python-only checks
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.scope.outputs.library_repository }}
          ref: ${{ steps.scope.outputs.library_revision }}
          path: ${{ steps.scope.outputs.library_path }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Check source correspondence, required verdicts and audit-tool regressions
        run: python3 -B scripts/bench/ci.py checks

      - name: Select changed cases and all affected dependencies
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FULL_AUDIT: ${{ steps.scope.outputs.full_audit }}
        run: >-
          python3 -B scripts/bench/ci.py affected --base "$BASE_SHA" --head "$HEAD_SHA"
          --full-audit "$FULL_AUDIT" --write "$RUNNER_TEMP/affected-plan.json"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: affected-proof-plan
          path: ${{ runner.temp }}/affected-plan.json
          retention-days: 7
          if-no-files-found: error

  affected:
    name: Changed cases and affected proof dependencies ${{ matrix.shard }}
    needs: checks
    if: needs.checks.outputs.affected_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.checks.outputs.affected_shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: affected-proof-plan
          path: ${{ runner.temp }}/affected-plan
      - name: Make room for proof replay
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - name: Read this shard's exact build selection
        id: targets
        run: >-
          python3 -B scripts/bench/ci.py build-targets
          --plan "$RUNNER_TEMP/affected-plan/affected-plan.json"
          --shard-index ${{ matrix.shard }} --github-output "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-lean
        with:
          build-args: ${{ steps.targets.outputs.build_args }}
      - uses: ./.github/actions/setup-comparator
      - name: Build and independently replay the complete affected selection
        run: >-
          python3 -B scripts/bench/ci.py verify-affected
          --plan "$RUNNER_TEMP/affected-plan/affected-plan.json"
          --workspace "$RUNNER_TEMP/affected-replay"
          --results "$RUNNER_TEMP/affected-result.json"
          --shard-index ${{ matrix.shard }}
      - name: Preserve the affected selection and replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affected-proof-result-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/affected-result.json
            ${{ runner.temp }}/affected-replay/build-logs/
            Logs/comparator-check-*/
          retention-days: 7
          if-no-files-found: ignore

  auditor:
    name: Proof-auditor rejection regressions
    needs: checks
    if: needs.checks.outputs.auditor_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Make room for the isolated audit fixtures
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - uses: ./.github/actions/build-lean
        with:
          build-args: VeriTile VeriTile.Meta.StatementAudit VeriTile.Meta.Disprove
      - uses: ./.github/actions/setup-comparator
      - name: Reject injected axioms, missed headlines and circular specifications
        run: python3 -B scripts/bench/ci.py auditor
      - name: Preserve failed audit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proof-auditor-regressions
          path: Logs/comparator-check-*/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Final entry build and replay ${{ matrix.shard }}
    needs: checks
    if: needs.checks.outputs.full_audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.checks.outputs.shards) }}
    env:
      AUDIT_TRUST_REPLAY: batch
      AUDIT_TRUST_AUDIT_JOBS: 2
      AUDIT_TRUST_BATCH_SIZE: 32
      AUDIT_TRUST_FILE_TIMEOUT: 1800
      AUDIT_TRUST_BATCH_TIMEOUT: 1800
      AUDIT_TRUST_HEARTBEAT_SECONDS: 30
      AUDIT_TRUST_JOBS: 1
      AUDIT_TRUST_SHARD_COUNT: ${{ needs.checks.outputs.shard_count }}
      AUDIT_TRUST_SHARD_INDEX: ${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v4
      - name: Make room for proof replay
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Fetch Mathlib cache with bounded network retries
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: |
          for delay in 0 5 15; do
            sleep "$delay"
            if lake exe cache get; then
              exit 0
            fi
          done
          exit 1
      - name: Build every selected module and its complete dependencies
        run: |
          snapshot="$RUNNER_TEMP/final-inventory.json"
          python3 scripts/bench/final_inventory.py --write "$snapshot"
          python3 scripts/bench/final_inventory.py --targets --snapshot "$snapshot" > "$RUNNER_TEMP/all-targets.txt"
          snapshot_sha256=$(sha256sum -- "$snapshot")
          printf 'AUDIT_TRUST_SNAPSHOT=%s\nAUDIT_TRUST_SNAPSHOT_SHA256=%s\n' \
            "$snapshot" "${snapshot_sha256%% *}" >> "$GITHUB_ENV"
          python3 scripts/bench/select_audit_shard.py "$AUDIT_TRUST_SHARD_COUNT" "$AUDIT_TRUST_SHARD_INDEX" \
            < "$RUNNER_TEMP/all-targets.txt" > "$RUNNER_TEMP/shard-targets.txt"
          test -s "$RUNNER_TEMP/shard-targets.txt"
          sed 's|/|.|g; s|\.lean$||' "$RUNNER_TEMP/shard-targets.txt" | xargs lake build
      - uses: ./.github/actions/setup-comparator
      - name: Replay selected entries and their proof dependencies
        run: scripts/bench/audit_trust.sh --final-inventory
      - name: Preserve failed audit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proof-audit-${{ matrix.shard }}
          path: Logs/comparator-check-*/
          retention-days: 7
          if-no-files-found: ignore

  complete:
    name: TritonBench-G audit complete
    needs: [checks, affected, auditor, audit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHECKS_RESULT: ${{ needs.checks.result }}
      AFFECTED_RESULT: ${{ needs.affected.result }}
      AFFECTED_REQUIRED: ${{ needs.checks.outputs.affected_required }}
      AUDITOR_REQUIRED: ${{ needs.checks.outputs.auditor_required }}
      CORPUS_RESULT: ${{ needs.audit.result }}
      AUDITOR_RESULT: ${{ needs.auditor.result }}
      FULL_AUDIT: ${{ needs.checks.outputs.full_audit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require every planned check, build and proof gate
        run: python3 -B scripts/bench/ci.py complete
