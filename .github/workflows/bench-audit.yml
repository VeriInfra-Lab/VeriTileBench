name: Bench audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Smoke checks, full Lean build, or full build and independent replay
        type: choice
        default: build
        options: [build, replay, smoke]
  schedule:
    # 04:00 Asia/Singapore: build daily, add replay on Sunday.
    # The UTC schedules do not overlap, so Sunday runs only once.
    - cron: '0 20 * * 0-5'
    - cron: '0 20 * * 6'

permissions:
  contents: read

concurrency:
  group: bench-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  global:
    name: Source inventory and benchmark smoke test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      shard_count: ${{ steps.scope.outputs.count }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - name: Select smoke, daily build, or weekly proof replay
        id: scope
        env:
          BENCH_AUDIT_MODE: ${{ inputs.mode }}
          BENCH_AUDIT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/bench/ci_audit.py scope
      - name: Make room for the complete Lean corpus
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - name: Install required source audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          command -v rg && command -v python3
      - uses: ./.github/actions/build-lean
        with:
          build-args: >-
            bench.tritonbench_g.matrix_transpose.RealCorrect
            bench.tritonbench_g.matrix_transpose.FPEquiv
            tests.lean.FPBgmvExpandSliceSource
            tests.lean.FPDecayCumsumSource
            tests.lean.FPDiagSsmTritonSource
            tests.lean.FPFastRopeEmbeddingSource
      - name: Check final source and audit regressions
        run: |
          python3 -B -m unittest discover -s tests/python -p 'test_*.py'
          python3 -B -m unittest discover -s scripts -p 'test_audit_source.py'
          python3 -B -m unittest discover -s scripts -p 'test_audit_shards.py'
          python3 -B -m unittest discover -s scripts -p 'test_bench_ci.py'
          python3 -B -m unittest discover -s scripts -p 'test_comparator_preflight.py'
          bash scripts/bench/audit_tritonbench_g.sh --source-only

  drafts:
    name: All 334 benchmark interfaces
    needs: global
    if: needs.global.outputs.mode != 'smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the benchmark builds
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "BugDetection PretrainKernels"
          test: false
          lint: false
          use-mathlib-cache: auto
      - name: Check final interfaces and recorded source bindings
        run: |
          python3 bench/bug_detection/check.py --verify-record
          python3 bench/pretrain_kernels/check.py --verify-record
          python3 scripts/bench/check_imported_kernel_review.py

  audit:
    name: Final entry ${{ needs.global.outputs.mode == 'replay' && 'build and replay' || 'build' }} ${{ matrix.shard }}
    needs: global
    if: needs.global.outputs.mode != 'smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.global.outputs.shards) }}
    env:
      AUDIT_TRUST_JOBS: 1
      AUDIT_TRUST_SHARD_COUNT: ${{ needs.global.outputs.shard_count }}
      AUDIT_TRUST_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - name: Make room for proof replay
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Fetch Mathlib cache with bounded network retries
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: |
          for delay in 0 5 15; do
            sleep "$delay"
            if lake exe cache get; then
              exit 0
            fi
          done
          exit 1
      - name: Build every selected module and its complete dependencies
        run: |
          snapshot="$RUNNER_TEMP/final-inventory.json"
          python3 scripts/bench/final_inventory.py --write "$snapshot"
          python3 scripts/bench/final_inventory.py --targets --snapshot "$snapshot" > "$RUNNER_TEMP/all-targets.txt"
          snapshot_sha256=$(sha256sum -- "$snapshot")
          printf 'AUDIT_TRUST_SNAPSHOT=%s\nAUDIT_TRUST_SNAPSHOT_SHA256=%s\n' \
            "$snapshot" "${snapshot_sha256%% *}" >> "$GITHUB_ENV"
          python3 scripts/bench/select_audit_shard.py "$AUDIT_TRUST_SHARD_COUNT" "$AUDIT_TRUST_SHARD_INDEX" \
            < "$RUNNER_TEMP/all-targets.txt" > "$RUNNER_TEMP/shard-targets.txt"
          test -s "$RUNNER_TEMP/shard-targets.txt"
          sed 's|/|.|g; s|\.lean$||' "$RUNNER_TEMP/shard-targets.txt" | xargs lake build
      - name: Verify the build source snapshot
        run: python3 scripts/bench/final_inventory.py --check --snapshot "$AUDIT_TRUST_SNAPSHOT"
      - uses: ./.github/actions/setup-comparator
        if: needs.global.outputs.mode == 'replay'
      - name: Replay selected entries and their proof dependencies
        if: needs.global.outputs.mode == 'replay'
        run: scripts/bench/audit_trust.sh --final-inventory

  complete:
    name: TritonBench-G audit complete
    needs: [global, drafts, audit]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    env:
      GLOBAL_RESULT: ${{ needs.global.result }}
      CORPUS_RESULT: ${{ needs.audit.result }}
      DRAFTS_RESULT: ${{ needs.drafts.result }}
      BENCH_AUDIT_MODE: ${{ needs.global.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Require every build and proof gate
        run: python3 scripts/bench/ci_audit.py complete
